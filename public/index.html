<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairox</title>
    <style>
        :root { --bg:#0f0f0f; --surface:#1a1a1a; --text:#e8eaed; --muted:#9aa0a6; --accent:#8ab4f8; --border:#2a2a2a; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; }
        .card { width:min(720px, 92vw); background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; }
        h1 { margin:0 0 8px; font-size:32px; }
        p { margin:0 0 20px; color:var(--muted); }
        .actions { display:flex; gap:12px; margin-bottom:20px; }
        .btn { text-decoration:none; border:none; border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; }
        .btn-primary { background:var(--accent); color:#0f172a; }
        .btn-secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
        .list { display:grid; gap:10px; }
        .chat-link { display:flex; align-items:center; justify-content:space-between; gap:10px; text-decoration:none; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
        .chat-link span:last-child { color:var(--muted); font-size:12px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Kairox</h1>
        <p>Choose a chat to continue, or open the app and start a new one.</p>
        <div class="actions">
            <a class="btn btn-primary" href="./chat.html">Open Chat App</a>
            <a class="btn btn-secondary" href="./chat.html" id="newChatLink">Start New Chat</a>
        </div>
        <section>
            <h2 style="font-size:16px; margin:0 0 10px;">Recent Chats</h2>
            <div id="recentChats" class="list"></div>
        </section>
    </main>

    <script src="./scripts/index.js"></script>
</body>
</html>
